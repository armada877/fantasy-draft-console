<script>document.documentElement.dataset.theme='light'</script><!-- light is the default; toggle switches to dark -->
<meta charset="utf-8">
<title>Fantasy Cockpit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8F%88%3C/text%3E%3C/svg%3E">
<style>
/* The `hidden` ATTRIBUTE must always win. A class that sets `display` (.banner, .sect,
   .panel, .helpwrap, .nm) outranks the UA's [hidden]{display:none}, so `el.hidden=true`
   silently does nothing — which is how the "players are synthetic" fixture banner ended
   up showing on real data. One guard, highest specificity, no exceptions. */
[hidden]{display:none !important}

/* ── Same palette as the draft console: cool slate neutrals, loud color reserved for
      decisions only. The launcher is the app's front door, so it shares the identity. ── */
:root{
  --ground:#080B0F; --panel:#151C25; --panel2:#202A35; --raise:#2B3742;
  --line:#3B4753; --line2:#516071;
  --ink:#ECF0F5; --muted:#AEB8C6; --faint:#828D9B;
  --go:#2FD39C; --go-bg:#0E2A22; --go-ink:#74E4BE; --go-line:#1F5D48;
  --stop:#F26A54; --stop-bg:#2B1712; --stop-ink:#F8A491; --stop-line:#743126;
  --warn:#E6B24A; --warn-ink:#F0C878; --warn-bg:#2A2313;
  --rb:#E79A54; --rb-bg:rgba(231,154,84,.15);
  --wr:#5B98EA; --wr-bg:rgba(91,152,234,.16);
  --te:#B98CEC; --te-bg:rgba(185,140,236,.16);
  --qb:#3AA6D0; --qb-bg:rgba(58,166,208,.16);
  --shadow:0 10px 28px -10px rgba(0,0,0,.6);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:12px;
}
:root[data-theme="light"]{
  --ground:#E4E9EE; --panel:#FFFFFF; --panel2:#EDF2F6; --raise:#E1E8EE;
  --line:#D3DBE3; --line2:#B6C2CD;
  --ink:#141C26; --muted:#586674; --faint:#8794A1;
  --go:#0E8F63; --go-bg:#DEF2E9; --go-ink:#0A7A53; --go-line:#9AD2BC;
  --stop:#C63F27; --stop-bg:#FAE6E0; --stop-ink:#A2321C; --stop-line:#E4AE9F;
  --warn:#A9781A; --warn-ink:#835C10; --warn-bg:#F3E8CC;
  --rb:#B4661C; --rb-bg:rgba(180,102,28,.13);
  --wr:#2C61A6; --wr-bg:rgba(44,97,166,.13);
  --te:#6E3D9E; --te-bg:rgba(110,61,158,.13);
  --qb:#176C8A; --qb-bg:rgba(23,108,138,.13);
  --shadow:0 1px 2px rgba(20,30,45,.05), 0 10px 26px -12px rgba(20,35,60,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;
  line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"cv08","ss01"}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--go);outline-offset:2px;border-radius:6px}

.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 40px}

/* ── masthead ── */
.top{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.brand .t{font-size:24px;font-weight:780;letter-spacing:-.01em;line-height:1.1}
.brand .s{font-size:9.5px;text-transform:uppercase;letter-spacing:.22em;color:var(--faint);margin-top:4px}
.top .spacer{flex:1}
.themebtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:9px;padding:0 13px;height:36px;font-size:16px}
.themebtn:hover{color:var(--ink);border-color:var(--line2)}
.stamp{font-size:10.5px;color:var(--faint);letter-spacing:.02em;text-align:right}

/* ── the league cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.card.mine-hot{box-shadow:var(--shadow),inset 3px 0 0 var(--go)}
.chead{padding:13px 15px 11px;border-bottom:1px solid var(--line);background:var(--panel2)}
.chead .lg{font-size:16px;font-weight:720;letter-spacing:-.005em;display:flex;align-items:baseline;gap:8px}
.chead .lg .yr{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.04em}
.chead .team{display:flex;align-items:baseline;gap:8px;margin-top:5px}
.chead .team .k{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--faint);font-weight:700;flex:none}
.chead .team .v{font-size:13px;font-weight:620;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cbody{padding:11px 15px 13px;display:flex;flex-direction:column;gap:11px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:10px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;
  padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:700;letter-spacing:.02em}
.chip.draft{border-color:var(--line2);color:var(--ink)}
.chip.faab{color:var(--go-ink);border-color:var(--go-line);background:var(--go-bg)}
.chip.prio{color:var(--warn-ink);border-color:var(--warn);background:var(--warn-bg)}
.chip.unk{color:var(--faint);border-style:dashed}

/* lineup strip — every league's actual starting shape, rendered from its own slots */
.slots{display:flex;flex-wrap:wrap;gap:4px}
.slot{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.02em;
  padding:2px 6px;border-radius:5px;background:var(--raise);color:var(--muted);white-space:nowrap}
.slot.s-QB{background:var(--qb-bg);color:var(--qb)}
.slot.s-RB{background:var(--rb-bg);color:var(--rb)}
.slot.s-WR{background:var(--wr-bg);color:var(--wr)}
.slot.s-TE{background:var(--te-bg);color:var(--te)}
.slot .x{opacity:.7;font-weight:500}

/* live vitals strip — only when a cockpit has been built for this league */
.vits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.vit{background:var(--panel);padding:6px 9px;min-width:0}
.vit .k{font-size:8.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vit .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:650;
  line-height:1.2;margin-top:1px;white-space:nowrap}
.vit .v small{font-size:10px;color:var(--faint);font-weight:400}
.vit.good .v{color:var(--go-ink)} .vit.bad .v{color:var(--stop-ink)}

.nodata{font-size:11.5px;color:var(--faint);border:1px dashed var(--line);border-radius:9px;
  padding:9px 11px;line-height:1.45}
.nodata b{color:var(--muted);font-weight:650}
.fixbadge{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;
  color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn);border-radius:5px;padding:1px 6px}

/* tool links — the point of the card */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:2px}
.tool{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 13px;border-radius:10px;
  border:1px solid var(--line2);background:var(--raise);min-height:52px}
.tool .n{font-size:13px;font-weight:720;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.tool .d{font-size:10px;color:var(--muted);letter-spacing:.01em}
.tool:hover{border-color:var(--muted)}
.tool.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tool.primary .d{color:var(--ground);opacity:.72}
.tool.primary:hover{opacity:.9}
.tool.off{opacity:.45;pointer-events:none;border-style:dashed;background:transparent}
.tool .arrow{margin-left:auto;font-size:14px;opacity:.6}

.empty{grid-column:1/-1;background:var(--panel);border:1px dashed var(--line2);border-radius:var(--r);
  padding:28px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.empty b{color:var(--ink)}
.empty code{font-family:var(--mono);font-size:12px;background:var(--raise);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px}

.foot{margin-top:24px;color:var(--faint);font-size:10.5px;text-align:center;line-height:1.5}

@media(max-width:560px){
  .wrap{padding:16px 11px 32px}
  .cards{grid-template-columns:1fr}
  .brand .t{font-size:20px}
  .vits{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stamp{text-align:left}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s !important;transition:none !important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="t">Fantasy Cockpit</div>
      <div class="s" id="sub">leagues</div>
    </div>
    <div class="spacer"></div>
    <div class="stamp" id="stamp"></div>
    <button class="themebtn" id="themebtn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </div>
  <div class="cards" id="cards"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = /*DATA*/;
const LEAGUES = DATA.leagues || [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Every fact below comes off the league's own payload. Nothing about team count,
   scoring, lineup shape or waiver model is assumed — a league with 2 QBs and no
   kicker renders exactly as truthfully as one with the reverse. */
function acqChip(a){
  if(!a || !a.model) return `<span class="chip unk">waivers —</span>`;
  if(a.model === "faab"){
    const b = (a.budget == null) ? "" : ` <b>$${a.budget}</b>`;
    return `<span class="chip faab">FAAB${b}${a.continuous ? " · cont" : ""}</span>`;
  }
  return `<span class="chip prio">Priority order</span>`;
}
function draftChip(lg){
  if(!lg.draft_type) return `<span class="chip unk" title="draft type not in this league's payload yet">draft —</span>`;
  const t = String(lg.draft_type).toLowerCase();
  const money = (t === "auction" && lg.auction_budget) ? ` <b>$${lg.auction_budget}</b>` : "";
  return `<span class="chip draft">${esc(t)}${money}</span>`;
}
function slotStrip(lg){
  const slots = lg.lineup_slots || {}, names = lg.slot_names || {};
  const ids = Object.keys(slots).sort((a,b)=>(+a)-(+b));
  if(!ids.length) return "";
  return `<div class="slots">` + ids.map(id=>{
    const n = names[id] || ("SLOT"+id), c = slots[id];
    return `<span class="slot s-${esc(n)}">${esc(n)}<span class="x">×${c}</span></span>`;
  }).join("") + `</div>`;
}
function vitals(lg){
  if(!lg.season_ready) return "";
  const r = lg.record || {}, rec = `${r.w ?? 0}-${r.l ?? 0}${r.t ? "-"+r.t : ""}`;
  // FAAB or priority — whichever this league actually uses.
  const money = (lg.acquisition && lg.acquisition.model === "faab")
    ? {k:"FAAB left", v: lg.faab_left == null ? "—" : `$${lg.faab_left}`,
       cls: (lg.faab_left != null && lg.acquisition.budget) &&
            lg.faab_left < lg.acquisition.budget * 0.2 ? "bad" : ""}
    : {k:"Waiver pri", v: lg.waiver_priority == null ? "—" : `#${lg.waiver_priority}`,
       cls: (lg.waiver_priority != null && lg.waiver_priority <= 3) ? "good" : ""};
  const odds = lg.playoff_odds == null ? null
    : {k:"Playoffs", v: Math.round(lg.playoff_odds*100)+"<small>%</small>",
       cls: lg.playoff_odds >= .6 ? "good" : (lg.playoff_odds <= .25 ? "bad" : "")};
  const cells = [
    {k:"Week", v: lg.week == null ? "—" : String(lg.week), cls:""},
    {k:"Record", v: rec, cls:""},
    money,
  ];
  if(odds) cells.push(odds);
  return `<div class="vits">` + cells.map(c =>
    `<div class="vit ${c.cls}"><div class="k">${c.k}</div><div class="v">${c.v}</div></div>`
  ).join("") + `</div>`;
}

function card(lg){
  const tools = lg.tools || {};
  const seasonOn = !!tools.season, draftOn = !!tools.draft;
  const fix = lg.fixture ? ` <span class="fixbadge" title="built from a synthetic fixture, not live league data">fixture</span>` : "";
  return `<div class="card">
    <div class="chead">
      <div class="lg">${esc(lg.name || lg.key)}<span class="yr">${esc(lg.season || "")}</span></div>
      <div class="team"><span class="k">Your team</span><span class="v">${esc(lg.team_name || "—")}</span></div>
    </div>
    <div class="cbody">
      <div class="chips">
        <span class="chip"><b>${lg.size ?? "?"}</b> teams</span>
        <span class="chip">${esc(lg.scoring_label || "scoring —")}</span>
        ${draftChip(lg)}
        ${acqChip(lg.acquisition)}
      </div>
      ${slotStrip(lg)}
      ${vitals(lg)}
      ${seasonOn ? "" : `<div class="nodata">No in-season payload yet. Run
         <b>season-build</b> then <b>season-inject</b> for <b>${esc(lg.key)}</b>.</div>`}
      ${lg.fixture ? `<div class="nodata">Cockpit built from ${fix} data — league shape is real, players are synthetic.</div>` : ""}
      <div class="tools">
        <a class="tool primary ${seasonOn ? "" : "off"}" href="/l/${encodeURIComponent(lg.key)}/season"
           ${seasonOn ? "" : 'tabindex="-1" aria-disabled="true"'}>
          <div class="n">In-season<span class="arrow">→</span></div>
          <div class="d">waivers · trades · lineup</div>
        </a>
        <a class="tool ${draftOn ? "" : "off"}" href="/l/${encodeURIComponent(lg.key)}/draft"
           ${draftOn ? "" : 'tabindex="-1" aria-disabled="true"'}>
          <div class="n">Draft<span class="arrow">→</span></div>
          <div class="d">${draftOn ? "auction console" : "not built"}</div>
        </a>
      </div>
    </div>
  </div>`;
}

$("#cards").innerHTML = LEAGUES.length
  ? LEAGUES.map(card).join("")
  : `<div class="empty"><b>No leagues registered.</b><br>Run <code>python3 leagues.py</code> to
     discover every team on your ESPN account, then
     <code>python3 draft_sheets/inject_season.py</code>.</div>`;

const seasons = [...new Set(LEAGUES.map(l=>l.season).filter(Boolean))];
$("#sub").textContent = `${LEAGUES.length} league${LEAGUES.length===1?"":"s"}`
  + (seasons.length === 1 ? ` · ${seasons[0]}` : "");
$("#stamp").textContent = DATA.generated
  ? "built " + new Date(DATA.generated).toLocaleString([], {month:"short", day:"numeric",
      hour:"2-digit", minute:"2-digit"}) : "";
$("#foot").textContent = "One app, every team. Each league is a separate context — its own data, "
  + "its own calibration, its own advisor briefing.";

$("#themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
</script>
