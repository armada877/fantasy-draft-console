<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23121d17'/%3E%3Cellipse cx='8' cy='8' rx='6' ry='4' fill='%23efc64f'/%3E%3Cpath d='M5 8h6M8 6.5v3' stroke='%23121d17' stroke-width='1'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap');

  :root{
    --field:#121d17; --panel:#1b2a21; --line:#2e4436;
    --chalk:#eae6d7; --dim:#9fb0a3;
    --gold:#efc64f; --sky:#8fc1e3; --danger:#e2795d;
    --disp:'Barlow Condensed','Arial Narrow',sans-serif;
    --body:'Iowan Old Style',Georgia,'Times New Roman',serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --t1:#efc64f; --t2:#e9a84c; --t3:#d98a56; --t4:#b98a7a; --t5:#8fc1e3;
    --t6:#7aa8c9; --t7:#6b93b3; --t8:#88a893; --t9:#7c9a86; --t10:#6f8b79;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--field);color:var(--chalk);
    font-family:var(--body);font-size:16px;line-height:1.55;
    display:flex;flex-direction:column}
  ::selection{background:var(--gold);color:var(--field)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ── header ────────────────────────────────────────────────────────── */
  header{border-top:3px solid var(--gold);border-bottom:1px solid var(--line);
    background:var(--panel);display:flex;align-items:center;gap:14px;
    padding:10px 20px;flex-wrap:wrap}
  header h1{font-family:var(--disp);font-weight:700;font-size:22px;
    letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  header h1 em{color:var(--gold);font-style:normal}
  header .sub{font-family:var(--mono);font-size:11px;color:var(--dim)}
  header .spacer{flex:1}
  nav{display:flex;gap:2px}
  nav button{border:none;background:none;color:var(--dim);
    font-family:var(--disp);font-weight:600;font-size:14px;
    letter-spacing:.1em;text-transform:uppercase;
    padding:6px 12px;cursor:pointer;border-bottom:2px solid transparent}
  nav button:hover{color:var(--chalk)}
  nav button.on{color:var(--gold);border-bottom-color:var(--gold)}
  select,button.ctl,.seg button{
    font-family:var(--disp);font-size:14px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;
    background:var(--field);color:var(--chalk);
    border:1px solid var(--line);border-radius:3px;padding:5px 10px;cursor:pointer}
  button.ctl:hover,select:hover{border-color:var(--gold)}
  button:disabled{opacity:.45;cursor:default}

  main{flex:1;overflow-y:auto;scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}}
  .col{max-width:840px;margin:0 auto;padding:26px 20px 40px}
  .view{display:none}.view.on{display:block}

  /* ── launcher home ─────────────────────────────────────────────────── */
  .apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px;margin-top:22px}
  .app{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:20px 18px 16px;cursor:pointer;text-align:left;color:var(--chalk);
    font-family:var(--body);display:flex;flex-direction:column;gap:8px;
    transition:border-color .12s}
  .app:hover{border-color:var(--gold)}
  .app h3{font-family:var(--disp);font-size:22px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase}
  .app h3 span{color:var(--gold)}
  .app p{color:var(--dim);font-size:14px;line-height:1.45}
  .app .k{font-family:var(--mono);font-size:10.5px;color:var(--dim);
    margin-top:auto;padding-top:8px}
  .home-head h2{font-family:var(--disp);font-size:30px;letter-spacing:.1em;
    text-transform:uppercase}
  .home-head h2 em{color:var(--gold);font-style:normal}
  .home-head p{color:var(--dim);max-width:60ch;margin-top:6px}

  /* ── shared app chrome ─────────────────────────────────────────────── */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-bottom:16px}
  .toolbar label{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .seg button{border:none;border-radius:0;background:var(--field)}
  .seg button.on{background:var(--gold);color:var(--field)}
  .meta-line{font-family:var(--mono);font-size:11px;color:var(--dim);
    margin-bottom:14px}
  .load{font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);display:flex;align-items:center;gap:10px;padding:20px 0}
  .load .ball{width:9px;height:9px;border-radius:50%;background:var(--gold);
    animation:snap 1s infinite alternate ease-in-out}
  @keyframes snap{from{transform:translateX(0)}to{transform:translateX(26px)}}
  @media (prefers-reduced-motion:reduce){.load .ball{animation:none}}
  .err{color:var(--danger);font-family:var(--mono);font-size:13px;padding:12px 0}

  /* ── tier board ────────────────────────────────────────────────────── */
  .tier{display:flex;gap:0;margin-bottom:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .tier .bar{width:6px;flex:none}
  .tier .num{font-family:var(--disp);font-weight:700;font-size:18px;
    width:58px;flex:none;display:flex;align-items:center;justify-content:center;
    color:var(--dim);border-right:1px solid var(--line)}
  .tier .players{padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px}
  .pchip{display:inline-flex;align-items:baseline;gap:6px;
    background:var(--field);border:1px solid var(--line);border-radius:3px;
    padding:3px 9px;font-size:14px}
  .pchip .v{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .pchip .tm{color:var(--dim);font-size:12px}
  .pchip.mine{border-color:var(--gold)}
  .pchip.mine::after{content:'MINE';font-family:var(--mono);font-size:9px;
    color:var(--field);background:var(--gold);border-radius:2px;padding:1px 4px}
  .pchip.fa{border-style:dashed;border-color:var(--dim)}
  .pchip.fa::after{content:'FA';font-family:var(--mono);font-size:9px;
    color:var(--dim);border:1px solid var(--dim);border-radius:2px;padding:0 4px}
  .pchip[data-own]:hover::after{content:attr(data-own)}
  .pchip.owned{opacity:.75}
  .pchip.owned::after{content:attr(data-own);font-family:var(--mono);
    font-size:9px;color:var(--dim)}

  /* ── lineup board ──────────────────────────────────────────────────── */
  table.board{border-collapse:collapse;width:100%;font-size:14.5px}
  table.board th{font-family:var(--disp);letter-spacing:.09em;
    text-transform:uppercase;font-size:12px;color:var(--dim);text-align:left;
    border-bottom:1px solid var(--line);padding:6px 10px}
  table.board td{padding:7px 10px;border-bottom:1px solid var(--line)}
  table.board td.slot{font-family:var(--disp);font-weight:700;color:var(--gold);
    letter-spacing:.08em;width:70px}
  table.board td.num{font-family:var(--mono);font-size:12.5px}
  table.board td.num.big{color:#fff;font-size:14px}
  table.board tr.benchhead td{font-family:var(--disp);color:var(--dim);
    letter-spacing:.12em;text-transform:uppercase;padding-top:16px;border-bottom:none}
  table.board tr.bench td{color:var(--dim)}
  table.board tr.bench td.slot{color:var(--line)}
  .flag{font-family:var(--mono);font-size:9.5px;border-radius:2px;padding:1px 4px;
    margin-left:6px;vertical-align:1px}
  .flag.inj{color:var(--danger);border:1px solid var(--danger)}
  .flag.bye{color:var(--sky);border:1px solid var(--sky)}
  .total{font-family:var(--disp);font-size:19px;letter-spacing:.08em;
    text-transform:uppercase;margin:14px 0 4px}
  .total b{color:var(--gold)}

  /* ── waivers ───────────────────────────────────────────────────────── */
  .wv-card{background:var(--panel);border:1px solid var(--line);border-radius:5px;
    padding:12px 14px;margin-bottom:10px}
  .wv-card .head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .wv-card .who{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.04em}
  .wv-card .bid{font-family:var(--mono);font-size:12px;color:var(--gold)}
  .wv-card .sub{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .wv-card ul{margin:8px 0 0 1.2em;font-size:13.5px;color:var(--dim)}
  .wv-card .urgent{color:var(--danger)}

  /* ── trades ────────────────────────────────────────────────────────── */
  .tr-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 12px}
  @media (max-width:640px){.tr-cols{grid-template-columns:1fr}}
  .tr-side{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
  .tr-side h4{font-family:var(--disp);font-size:14px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  .tr-side h4 b{color:var(--chalk)}
  .tr-side .list{display:flex;flex-wrap:wrap;gap:6px}
  .tr-p{font-size:13.5px;background:var(--field);border:1px solid var(--line);
    border-radius:3px;padding:3px 9px;cursor:pointer;color:var(--chalk);
    font-family:var(--body)}
  .tr-p .tm{color:var(--dim);font-size:11.5px;font-family:var(--mono)}
  .tr-p.sel{border-color:var(--gold);background:#2a2410}
  .tr-eval{margin:4px 0 16px;display:flex;gap:10px;align-items:center}
  .verdict{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.1em;
    text-transform:uppercase}
  .verdict.accept{color:var(--gold)} .verdict.counter{color:var(--sky)}
  .verdict.decline{color:var(--danger)}
  .tr-res{background:var(--panel);border:1px solid var(--line);border-radius:5px;
    padding:12px 14px;margin-bottom:16px}
  .tr-res .nums{font-family:var(--mono);font-size:12.5px;margin:6px 0}
  .tr-res ul{margin:6px 0 0 1.2em;font-size:13.5px;color:var(--dim)}
  .tr-sec{font-family:var(--disp);font-size:16px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold);margin:18px 0 8px}

  /* ── wire ──────────────────────────────────────────────────────────── */
  .wire-item{background:var(--panel);border:1px solid var(--line);
    border-radius:5px;padding:12px 14px;margin-bottom:10px}
  .wire-item .head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .wire-item .who{font-family:var(--disp);font-weight:700;font-size:17px;
    letter-spacing:.04em}
  .wire-item .tag{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .wire-item .tag.inj{color:var(--danger)}
  .wire-item .body{margin-top:6px;font-size:14.5px}
  .wire-item .src{font-family:var(--mono);font-size:11px;margin-top:6px}
  .wire-item .src a{color:var(--sky)}
  input.filter{background:var(--field);color:var(--chalk);
    border:1px solid var(--line);border-radius:3px;padding:6px 10px;
    font-family:var(--body);font-size:14px;min-width:220px}
  input.filter:focus{border-color:var(--gold);outline:none}

  /* ── desk (chat) ───────────────────────────────────────────────────── */
  .turn{margin-bottom:26px}
  .eyebrow{font-family:var(--disp);font-weight:600;font-size:12.5px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  .you .eyebrow{color:var(--gold)}
  .you .body{border-left:3px solid var(--gold);padding-left:14px;
    font-family:var(--disp);font-weight:500;font-size:19px;line-height:1.35;
    white-space:pre-wrap}
  .desk .body{max-width:68ch}
  .desk .body p{margin:0 0 .8em}
  .desk .body h1,.desk .body h2,.desk .body h3{font-family:var(--disp);
    letter-spacing:.05em;text-transform:uppercase;margin:1em 0 .4em;
    font-size:17px;color:var(--gold)}
  .desk .body ul,.desk .body ol{margin:0 0 .8em 1.3em}
  .desk .body li{margin:.15em 0}
  .desk .body a{color:var(--sky)}
  .desk .body code{font-family:var(--mono);font-size:13px;background:var(--panel);
    border:1px solid var(--line);border-radius:3px;padding:1px 5px}
  .desk .body pre{background:var(--panel);border:1px solid var(--line);
    border-radius:4px;padding:10px 12px;overflow-x:auto;margin:0 0 .8em}
  .desk .body pre code{background:none;border:none;padding:0}
  .desk .body table{border-collapse:collapse;margin:0 0 .8em;font-size:14px;width:100%}
  .desk .body th,.desk .body td{border:1px solid var(--line);padding:4px 9px;text-align:left}
  .desk .body th{font-family:var(--disp);letter-spacing:.06em;
    text-transform:uppercase;font-size:12.5px;color:var(--dim)}
  .desk .body strong{color:#fff}
  .chips{display:flex;flex-direction:column;gap:4px;margin:8px 0 12px}
  .chip{font-family:var(--mono);font-size:12px;color:var(--dim);
    display:flex;align-items:center;gap:8px;
    border-left:3px solid var(--line);padding:2px 0 2px 11px}
  .chip .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--dim)}
  .chip.myleague{border-left-color:var(--gold)}
  .chip.myleague .dot{background:var(--gold)}
  .chip.ffresearch{border-left-color:var(--sky)}
  .chip.ffresearch .dot{background:var(--sky)}
  .chip.websearch{border-left-color:#c9a2e0}
  .chip.websearch .dot{background:#c9a2e0}
  .chip .fn{color:var(--chalk)}
  .meta{font-family:var(--mono);font-size:11px;color:var(--dim);
    border-top:1px solid var(--line);margin-top:10px;padding-top:6px;display:inline-block}
  .error .body{color:var(--danger);font-family:var(--mono);font-size:13px}
  .working{display:flex;align-items:center;gap:10px;color:var(--dim);
    font-family:var(--disp);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .working .ball{width:9px;height:9px;border-radius:50%;background:var(--gold);
    animation:snap 1s infinite alternate ease-in-out}
  #deskbar{border-top:1px solid var(--line);background:var(--panel);
    padding:12px 20px;display:none}
  #deskbar.on{display:block}
  .callsheet{max-width:840px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--field);color:var(--chalk);
    border:1px solid var(--line);border-radius:4px;
    font-family:var(--body);font-size:15px;line-height:1.45;
    padding:10px 12px;min-height:44px;max-height:180px}
  textarea:focus{border-color:var(--gold);outline:none}
  .send{background:var(--gold);color:var(--field);border-color:var(--gold);
    font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.06em;
    text-transform:uppercase;border:1px solid var(--gold);border-radius:3px;
    padding:10px 22px;cursor:pointer}
  .send:hover{filter:brightness(1.08)}
  .empty{color:var(--dim);max-width:62ch}
  .empty .try{margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .empty .try button{text-transform:none;letter-spacing:0;font-family:var(--body);
    font-weight:400;font-size:14px;color:var(--dim);text-align:left;
    border:1px dashed var(--line);background:var(--field);border-radius:3px;
    padding:5px 10px;cursor:pointer}
  .empty .try button:hover{color:var(--chalk);border-color:var(--gold)}
</style>
</head>
<body>

<header>
  <h1 id="wordmark">Research <em>Desk</em></h1>
  <span class="sub" id="status">checking…</span>
  <span class="spacer"></span>
  <nav id="nav">
    <button data-app="desk">Desk</button>
    <button data-app="lineup">Lineup</button>
    <button data-app="waivers">Waivers</button>
    <button data-app="trades">Trades</button>
    <button data-app="tiers">Tier board</button>
    <button data-app="value">Value board</button>
    <button data-app="wire">The wire</button>
  </nav>
  <span id="deskctl" style="display:none">
    <select id="model">
      <option value="claude-sonnet-5" selected>sonnet 5</option>
      <option value="claude-haiku-4-5">haiku 4.5</option>
      <option value="claude-opus-5">opus 5</option>
    </select>
    <button class="ctl" id="reset" type="button">New session</button>
  </span>
</header>

<main>
  <!-- home / launcher -->
  <div class="view col" id="view-home">
    <div class="home-head">
      <h2>What are we <em>looking at</em>?</h2>
      <p>One desk — your leagues' data, the public sheet, and an agent that
         reads both.</p>
    </div>
    <div class="apps">
      <button class="app" data-app="desk">
        <h3><span>Desk</span> · ask the agent</h3>
        <p>Chat with the research agent: rosters, waivers, trades, tiers, news,
           weather, Vegas — with sources cited and follow-ups that keep the thread.</p>
        <div class="k">agent · all tools · web search on</div>
      </button>
      <button class="app" data-app="lineup">
        <h3><span>Lineup</span> · this week</h3>
        <p>The optimal Tue–Tue lineup for any of your teams, from this week's
           projections. Engine-solved, 2QB-safe. Bench shown for the close calls.</p>
        <div class="k">no model · league engine</div>
      </button>
      <button class="app" data-app="waivers">
        <h3><span>Waivers</span> · targets &amp; bids</h3>
        <p>The console's waiver board: what each add is worth to your starters,
           the suggested FAAB bid, who's likely to contest it, and what to drop.</p>
        <div class="k">no model · priced vs opponent tendencies</div>
      </button>
      <button class="app" data-app="trades">
        <h3><span>Trades</span> · compare &amp; evaluate</h3>
        <p>Pick any package between your roster and a partner's and get both
           sides' lineup delta, accept odds, veto risk, and a counter — plus the
           finder's suggestions and buy-low/sell-high.</p>
        <div class="k">no model · engine evaluate_offer</div>
      </button>
      <button class="app" data-app="tiers">
        <h3><span>Tier board</span> · Chen's method</h3>
        <p>Boris Chen's clustering run live for your league — expert consensus
           or your league's own projections — with every player tagged mine /
           free agent / owner.</p>
        <div class="k">no model · GMM port of fftiers</div>
      </button>
      <button class="app" data-app="value">
        <h3><span>Value board</span> · FP × my league</h3>
        <p>FantasyPros consensus points turned into value-over-replacement for
           your exact league shape — scoring flavor and every starting seat
           (FLEX and superflex pooled) set the baseline.</p>
        <div class="k">no model · fp r2p_pts · league VOR</div>
      </button>
      <button class="app" data-app="wire">
        <h3><span>The wire</span> · player news</h3>
        <p>The live beat-writer wire: full reports, attribution, and links to the
           source tweets. Filter by player or team.</p>
        <div class="k">no model · rotowire syndication</div>
      </button>
    </div>
  </div>

  <!-- desk (chat) -->
  <div class="view col" id="view-desk">
    <div class="empty" id="empty">
      <p>Ask about your leagues — rosters, lineups, waivers, trades, the
         opponent model — or the public sheet. Follow-ups keep the thread.</p>
      <div class="try" id="starters">
        <button type="button">Set my best week-2 lineup in 2kdome and flag the close calls.</button>
        <button type="button">Which manager in chi-phi is the softest trade target right now?</button>
        <button type="button">Cross-check the console's top waiver bid against the tier board.</button>
      </div>
    </div>
    <div id="log"></div>
  </div>

  <!-- lineup -->
  <div class="view col" id="view-lineup">
    <div class="toolbar">
      <label for="lu-league">league</label><select id="lu-league"></select>
      <button class="ctl" id="lu-go">Refresh</button>
    </div>
    <div id="lu-out"></div>
  </div>

  <!-- waivers -->
  <div class="view col" id="view-waivers">
    <div class="toolbar">
      <label for="wv-league">league</label><select id="wv-league"></select>
      <button class="ctl" id="wv-go">Refresh</button>
    </div>
    <div id="wv-out"></div>
  </div>

  <!-- trades -->
  <div class="view col" id="view-trades">
    <div class="toolbar">
      <label for="tr-league">league</label><select id="tr-league"></select>
      <label for="tr-partner">partner</label><select id="tr-partner"></select>
    </div>
    <div id="tr-picker"></div>
    <div id="tr-result"></div>
    <div id="tr-boards"></div>
  </div>

  <!-- tiers -->
  <div class="view col" id="view-tiers">
    <div class="toolbar">
      <label for="tb-league">league</label><select id="tb-league"></select>
      <div class="seg" id="tb-pos"></div>
      <div class="seg" id="tb-src">
        <button data-v="consensus" class="on">FP consensus</button>
        <button data-v="projections">League proj</button>
      </div>
      <div class="seg" id="tb-hz">
        <button data-v="week" class="on">This week</button>
        <button data-v="ros">Rest of season</button>
      </div>
    </div>
    <div id="tb-out"></div>
  </div>

  <!-- value board -->
  <div class="view col" id="view-value">
    <div class="toolbar">
      <label for="vb-league">league</label><select id="vb-league"></select>
      <div class="seg" id="vb-hz">
        <button data-v="week" class="on">This week</button>
        <button data-v="ros">Rest of season</button>
      </div>
      <button class="ctl" id="vb-go">Refresh</button>
    </div>
    <div id="vb-out"></div>
  </div>

  <!-- wire -->
  <div class="view col" id="view-wire">
    <div class="toolbar">
      <input class="filter" id="w-q" placeholder="filter: player, team, position…">
      <button class="ctl" id="w-go">Refresh</button>
    </div>
    <div id="w-out"></div>
  </div>
</main>

<form id="deskbar">
  <div class="callsheet">
    <textarea id="input" rows="1" placeholder="Call it in… (Enter to send, Shift+Enter for a new line)"
              aria-label="Ask the research agent"></textarea>
    <button class="send" id="send" type="submit">Ask</button>
  </div>
</form>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const el = (tag, cls, html) => { const d = document.createElement(tag);
    if (cls) d.className = cls; if (html !== undefined) d.innerHTML = html; return d; };

  // ── health + leagues ──────────────────────────────────────────────────
  let LEAGUES = [];
  fetch('/healthz').then(r => r.json()).then(h => {
    $('status').textContent = h.agent
      ? (h.leagues ? 'agent ready · leagues loaded' : 'agent ready · no league data')
      : 'no API key on server';
  }).catch(() => $('status').textContent = 'server unreachable');
  const leaguesReady = fetch('/api/leagues').then(r => r.json()).then(ls => {
    LEAGUES = ls;
    for (const sel of [$('lu-league'), $('tb-league'), $('vb-league'), $('wv-league'), $('tr-league')]) {
      sel.innerHTML = ls.map(l =>
        `<option value="${esc(l.key)}">${esc(l.key)} — ${esc(l.team)}</option>`).join('');
    }
  }).catch(() => {});

  // ── router ────────────────────────────────────────────────────────────
  const APPS = ['home', 'desk', 'lineup', 'waivers', 'trades', 'tiers', 'value', 'wire'];
  function show(app){
    if (!APPS.includes(app)) app = 'home';
    for (const a of APPS){
      const v = $('view-' + a); if (v) v.classList.toggle('on', a === app);
    }
    document.querySelectorAll('#nav button').forEach(b =>
      b.classList.toggle('on', b.dataset.app === app));
    $('deskbar').classList.toggle('on', app === 'desk');
    $('deskctl').style.display = app === 'desk' ? '' : 'none';
    if (app === 'lineup') loadLineup();
    if (app === 'waivers') loadWaivers();
    if (app === 'trades') loadTrades();
    if (app === 'tiers') loadTiers();
    if (app === 'value') loadValue();
    if (app === 'wire' && !$('w-out').childElementCount) loadWire();
    if (app === 'desk') $('input').focus();
    if (location.hash !== '#' + app) history.replaceState(null, '', '#' + app);
  }
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  document.querySelectorAll('[data-app]').forEach(b =>
    b.addEventListener('click', () => show(b.dataset.app)));
  $('wordmark').addEventListener('click', () => show('home'));

  const loading = box => { box.innerHTML = ''; box.appendChild(
    el('div', 'load', '<span class="ball"></span><span>on the film</span>')); };
  const fail = (box, msg) => { box.innerHTML = ''; box.appendChild(el('div', 'err', esc(msg))); };

  // ── lineup app ────────────────────────────────────────────────────────
  async function loadLineup(){
    await leaguesReady;
    const box = $('lu-out'); loading(box);
    try {
      const r = await fetch('/api/lineup?league=' + encodeURIComponent($('lu-league').value));
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const d = await r.json();
      const row = (p, cls, slot) => `
        <tr class="${cls}"><td class="slot">${esc(slot)}</td>
        <td>${esc(p.name)} <span class="tm">${esc(p.pos)}, ${esc(p.team)}</span>
          ${p.injury ? `<span class="flag inj">${esc(p.injury)}</span>` : ''}
          ${p.bye ? '<span class="flag bye">BYE</span>' : ''}</td>
        <td class="num big">${p.wk_pts.toFixed(1)}</td>
        <td class="num">${p.ros_ppg.toFixed(1)}</td>
        <td class="num">${p.last3.toFixed(1)}</td></tr>`;
      box.innerHTML = `
        <div class="meta-line">${esc(d.team.name)} (${d.team.mine ? 'my team' : esc(d.team.manager)})
          · ${esc(d.freshness)}</div>
        <div class="total">Week ${d.week} optimal · <b>${d.total.toFixed(1)} pts</b></div>
        <table class="board">
          <tr><th>slot</th><th>player</th><th>this wk</th><th>ros</th><th>last 3</th></tr>
          ${d.slots.map(p => row(p, '', p.slot)).join('')}
          <tr class="benchhead"><td colspan="5">Bench — the close calls</td></tr>
          ${d.bench.map(p => row(p, 'bench', '—')).join('')}
        </table>
        <div class="meta-line" style="margin-top:12px">Rosters lock Tue–Tue: this
          board ranks by THIS week's projection. Anything within ~2 pts of a
          starter deserves a matchup/news check — ask the Desk.</div>`;
    } catch (e){ fail(box, e); }
  }
  $('lu-go').addEventListener('click', loadLineup);
  $('lu-league').addEventListener('change', loadLineup);

  // ── waivers app ───────────────────────────────────────────────────────
  async function loadWaivers(){
    await leaguesReady;
    const box = $('wv-out'); loading(box);
    try {
      const r = await fetch('/api/waivers?league=' + encodeURIComponent($('wv-league').value));
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const d = await r.json();
      const budget = d.faab_left != null ? `FAAB left: $${d.faab_left}`
                   : `waiver priority: ${d.waiver_priority ?? '—'}`;
      box.innerHTML = `<div class="meta-line">week ${d.week} · ${esc(budget)}
          · ${esc(d.freshness)} · bids already priced against opponent tendencies</div>`
        + (d.rows.length ? d.rows.map(r => {
          const p = r.player || {};
          const bid = r.bid ? ` <span class="bid">bid $${r.bid.suggested}
              (p80 $${r.bid.p80}, contested ${Math.round((r.bid.p_contested || 0) * 100)}%)</span>` : '';
          const urgent = r.act_by != null && !r.deferrable;
          return `<div class="wv-card">
            <div class="head"><span class="who">ADD ${esc(p.name || '?')}</span>
              <span class="sub">${esc(p.pos || '')} ${esc(p.team || '')}
                · wk ${p.wk_pts ?? '—'} / ros ${p.ros_ppg ?? '—'} ppg</span>${bid}</div>
            <div class="sub" style="margin-top:4px">
              ${r.drop ? 'drop ' + esc(r.drop.name) + ' (' + esc(r.drop.pos) + ', ros '
                + r.drop.ros_ppg + ')' : 'roster spot open'}
              · +${r.marginal_reg ?? '?'} pts to your starters rest-of-season
              ${r.act_by != null ? ` · <span class="${urgent ? 'urgent' : ''}">act by wk ${r.act_by}${r.deferrable ? ' (deferrable)' : ''}</span>` : ''}</div>
            ${r.drop_warning ? '<div class="sub urgent" style="margin-top:6px">⚠ '
              + esc(r.drop_warning) + '</div>' : ''}
            <ul>${(r.why || []).map(w => '<li>' + esc(w) + '</li>').join('')}</ul>
          </div>`;
        }).join('') : '<div class="meta-line">The board is empty in the current payload.</div>')
        + `<div class="meta-line" style="margin-top:10px">Marginal points are
          optimal-lineup math over remaining weeks (a second DST scores as
          best-of-two weekly) — projection-level edges, not certainties. IR
          warnings mean the engine's drop pick has a better alternative it
          can't see.</div>`;
    } catch (e){ fail(box, e); }
  }
  $('wv-go').addEventListener('click', loadWaivers);
  $('wv-league').addEventListener('change', loadWaivers);

  // ── trades app ────────────────────────────────────────────────────────
  let trData = null, trSel = {send: new Set(), receive: new Set()};
  const trPlayerBtn = (p, side) =>
    `<button class="tr-p${trSel[side].has(p.id) ? ' sel' : ''}" data-side="${side}"
       data-id="${p.id}">${esc(p.name)} <span class="tm">${esc(p.pos)}
       · ros ${p.ros_ppg}</span></button>`;

  async function loadTrades(){
    await leaguesReady;
    const box = $('tr-boards'); loading(box); $('tr-picker').innerHTML = '';
    $('tr-result').innerHTML = '';
    trSel = {send: new Set(), receive: new Set()};
    try {
      const r = await fetch('/api/trades?league=' + encodeURIComponent($('tr-league').value));
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      trData = await r.json();
      $('tr-partner').innerHTML = trData.teams.map(t =>
        `<option value="${t.team_id}">${esc(t.name)} — ${esc(t.manager)}</option>`).join('');
      await loadPicker();
      renderBoards();
    } catch (e){ fail(box, e); }
  }

  async function loadPicker(){
    const pid = $('tr-partner').value;
    const t = (trData.teams || []).find(x => String(x.team_id) === pid) || {};
    const r = await fetch(`/api/rosters?league=${encodeURIComponent($('tr-league').value)}&partner=${pid}`);
    if (!r.ok){ fail($('tr-picker'), (await r.json()).detail); return; }
    const d = await r.json();
    $('tr-picker').innerHTML = `
      <div class="meta-line">${esc(t.manager || '')}: trades ${t.trade_rate ?? '?'}/season,
        accepts ${Math.round((t.accept_rate || 0) * 100)}% of offers,
        ${t.responds ? 'responds to offers' : 'often ignores offers'}
        · playoff odds ${Math.round((t.playoff_odds || 0) * 100)}%</div>
      <div class="tr-cols">
        <div class="tr-side"><h4>I send — <b>${esc(d.mine.name)}</b></h4>
          <div class="list">${d.mine.players.map(p => trPlayerBtn(p, 'send')).join('')}</div></div>
        <div class="tr-side"><h4>I receive — <b>${esc(d.partner.name)}</b></h4>
          <div class="list">${d.partner.players.map(p => trPlayerBtn(p, 'receive')).join('')}</div></div>
      </div>
      <div class="tr-eval">
        <button class="ctl" id="tr-eval-go">Evaluate trade</button>
        <span class="sub" id="tr-eval-hint" style="font-family:var(--mono);font-size:11px;color:var(--dim)">
          pick at least one player on each side</span>
      </div>`;
    $('tr-picker').querySelectorAll('.tr-p').forEach(b => b.addEventListener('click', () => {
      const set = trSel[b.dataset.side], id = Number(b.dataset.id);
      set.has(id) ? set.delete(id) : set.add(id);
      b.classList.toggle('sel');
    }));
    $('tr-eval-go').addEventListener('click', evalTrade);
  }

  async function evalTrade(){
    const out = $('tr-result');
    if (!trSel.send.size || !trSel.receive.size){
      out.innerHTML = '<div class="err">Pick at least one player on each side.</div>'; return;
    }
    loading(out);
    try {
      const r = await fetch('/api/trade_eval', {method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({league: $('tr-league').value, partner: $('tr-partner').value,
          send: [...trSel.send].map(String), receive: [...trSel.receive].map(String)})});
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const d = await r.json();
      const fmt = ps => ps.map(p => `${esc(p.name)} (${esc(p.pos)}, ros ${p.ros_ppg})`).join(' + ');
      out.innerHTML = `<div class="tr-res">
        <span class="verdict ${esc(d.verdict)}">${esc(d.verdict)}</span>
        <div class="nums">my starters ${d.my_delta >= 0 ? '+' : ''}${d.my_delta} pts
          (playoff wks ${d.my_delta_post >= 0 ? '+' : ''}${d.my_delta_post})
          · their starters ${d.their_delta >= 0 ? '+' : ''}${d.their_delta}
          · P(accept) ${Math.round(d.accept_odds * 100)}%
          · veto ${Math.round(d.veto_risk * 100)}%</div>
        <div class="sub" style="font-size:13px">send ${fmt(d.send)} → receive ${fmt(d.receive)}</div>
        <ul>${(d.why || []).map(w => '<li>' + esc(w) + '</li>').join('')}</ul>
        ${d.counter ? `<div class="nums" style="color:var(--sky)">counter idea: send
          ${fmt(d.counter.send)} for ${fmt(d.counter.receive)} — me
          +${d.counter.my_delta}, them +${d.counter.their_delta},
          P(accept) ${Math.round(d.counter.accept_odds * 100)}%</div>` : ''}
      </div>`;
    } catch (e){ fail(out, e); }
  }

  function renderBoards(){
    const box = $('tr-boards');
    const fmtSide = ps => (ps || []).map(p => `${esc(p.name)} (${esc(p.pos)})`).join(' + ');
    const form = (rows, label) => rows.length ? `<div class="tr-sec">${label}</div>`
      + rows.map(r => `<div class="wv-card"><div class="head">
          <span class="who">${esc(r.player?.name || '?')}</span>
          <span class="sub">${esc(r.player?.pos || '')} · ros ${r.player?.ros_ppg}</span></div>
        <ul>${(r.why || []).map(w => '<li>' + esc(w) + '</li>').join('')}</ul></div>`).join('') : '';
    box.innerHTML =
      (trData.finder.length ? `<div class="tr-sec">Finder — mutually positive packages</div>`
        + trData.finder.map(f => {
          const t = trData.teams.find(x => x.team_id === f.partner_team_id) || {};
          return `<div class="wv-card"><div class="head">
            <span class="who">${esc(t.manager || '?')}</span>
            <span class="sub">send ${fmtSide(f.send)} → get ${fmtSide(f.receive)}
              · me +${f.my_delta} / them +${f.their_delta}
              · P(accept) ${Math.round((f.accept_odds || 0) * 100)}%</span></div>
            <ul>${(f.why || []).map(w => '<li>' + esc(w) + '</li>').join('')}</ul></div>`;
        }).join('') : '<div class="meta-line">Finder found no mutually-positive packages in the current payload.</div>')
      + form(trData.buy_low, 'Buy low')
      + form(trData.sell_high, 'Sell high');
  }
  $('tr-league').addEventListener('change', loadTrades);
  $('tr-partner').addEventListener('change', () => { trSel = {send: new Set(), receive: new Set()};
    $('tr-result').innerHTML = ''; loadPicker(); });

  // ── tier board app ────────────────────────────────────────────────────
  const POSITIONS = ['QB', 'RB', 'WR', 'TE', 'FLEX', 'K', 'DST'];
  let tbPos = 'RB', tbSrc = 'consensus', tbHz = 'week';
  $('tb-pos').innerHTML = POSITIONS.map(p =>
    `<button data-v="${p}"${p === tbPos ? ' class="on"' : ''}>${p}</button>`).join('');
  $('tb-pos').addEventListener('click', e => {
    if (!e.target.dataset.v) return;
    tbPos = e.target.dataset.v;
    $('tb-pos').querySelectorAll('button').forEach(b =>
      b.classList.toggle('on', b.dataset.v === tbPos));
    loadTiers();
  });
  $('tb-src').addEventListener('click', e => {
    if (!e.target.dataset.v) return;
    tbSrc = e.target.dataset.v;
    $('tb-src').querySelectorAll('button').forEach(b =>
      b.classList.toggle('on', b.dataset.v === tbSrc));
    loadTiers();
  });
  $('tb-hz').addEventListener('click', e => {
    if (!e.target.dataset.v) return;
    tbHz = e.target.dataset.v;
    $('tb-hz').querySelectorAll('button').forEach(b =>
      b.classList.toggle('on', b.dataset.v === tbHz));
    loadTiers();
  });
  $('tb-league').addEventListener('change', loadTiers);
  async function loadTiers(){
    await leaguesReady;
    const box = $('tb-out'); loading(box);
    try {
      const r = await fetch(`/api/tiers?league=${encodeURIComponent($('tb-league').value)}`
        + `&position=${tbPos}&source=${tbSrc}&horizon=${tbHz}`);
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const d = await r.json();
      box.innerHTML = `<div class="meta-line">${esc(d.head)}</div>`
        + d.tiers.map(g => {
          const color = `var(--t${Math.min(g.tier, 10)})`;
          return `<div class="tier"><div class="bar" style="background:${color}"></div>
            <div class="num" style="color:${color}">T${g.tier}</div>
            <div class="players">${g.players.map(p => {
              const cls = p.tag === 'MINE' ? 'mine' : p.tag === 'FA' ? 'fa'
                        : p.tag ? 'owned' : '';
              const own = p.tag && p.tag.startsWith('owned:')
                ? ` data-own="${esc(p.tag.slice(7).trim())}"` : '';
              return `<span class="pchip ${cls}"${own}>${esc(p.name)}
                <span class="tm">${esc(p.team)}${p.opp ? ' ' + esc(p.opp) : ''}</span>
                <span class="v">${p.value}${d.unit === 'ppg' ? '' : ''}</span></span>`;
            }).join('')}</div></div>`;
        }).join('')
        + `<div class="meta-line" style="margin-top:10px">Gold border = my roster,
           dashed = free agent, dimmed = rostered by the named manager. Tier
           breaks are where the model finds a real gap; within a tier,
           differences are noise. Unit: ${esc(d.unit)}.</div>`;
    } catch (e){ fail(box, e); }
  }

  // ── value board app ───────────────────────────────────────────────────
  let vbHz = 'week';
  async function loadValue(){
    await leaguesReady;
    const box = $('vb-out'); loading(box);
    try {
      const r = await fetch('/api/fpvalue?league=' + encodeURIComponent($('vb-league').value)
        + '&horizon=' + vbHz);
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const d = await r.json();
      const rep = Object.entries(d.replacement).map(([k, v]) => `${k} ${v}`).join(' · ');
      box.innerHTML = `
        <div class="meta-line">FantasyPros consensus (${d.horizon === 'ros'
          ? 'rest of season, season-total points' : 'week ' + d.week},
          ${d.experts} experts, flavor ${esc(d.scoring)}) − replacement for
          ${esc(d.league)}'s shape: ${d.size} teams, ${esc(d.lineup)}</div>
        <div class="meta-line">replacement level: ${esc(rep)}</div>
        <table class="board">
          <tr><th>VOR</th><th>pos</th><th>player</th><th>fp pts</th><th>owner</th></tr>
          ${d.rows.map(p => `<tr${p.starter ? '' : ' class="bench"'}>
            <td class="num big">${p.vor >= 0 ? '+' : ''}${p.vor.toFixed(1)}</td>
            <td class="slot">${esc(p.pos)}</td>
            <td>${esc(p.name)} <span class="tm">${esc(p.team)} ${esc(p.opp)}</span></td>
            <td class="num">${p.pts.toFixed(1)}</td>
            <td class="num">${p.tag === 'MINE' ? '<b style="color:var(--gold)">MINE</b>'
              : p.tag === 'FA' ? 'FA' : esc((p.tag || '').replace('owned: ', ''))}</td>
          </tr>`).join('')}
        </table>
        <div class="meta-line" style="margin-top:12px">${esc(d.note)} Dimmed
          rows sit at or below replacement in this league. One number,
          cross-position: a +6 RB and a +6 QB are equally scarce HERE.</div>`;
    } catch (e){ fail(box, e); }
  }
  $('vb-hz').addEventListener('click', e => {
    if (!e.target.dataset.v) return;
    vbHz = e.target.dataset.v;
    $('vb-hz').querySelectorAll('button').forEach(b =>
      b.classList.toggle('on', b.dataset.v === vbHz));
    loadValue();
  });
  $('vb-go').addEventListener('click', loadValue);
  $('vb-league').addEventListener('change', loadValue);

  // ── wire app ──────────────────────────────────────────────────────────
  async function loadWire(){
    const box = $('w-out'); loading(box);
    try {
      const q = $('w-q').value.trim();
      const r = await fetch('/api/news' + (q ? '?query=' + encodeURIComponent(q) : ''));
      if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
      const d = await r.json();
      box.innerHTML = d.items.length ? d.items.map(i => `
        <div class="wire-item">
          <div class="head"><span class="who">${esc(i.player)}</span>
            <span class="tag">${esc(i.pos)} · ${esc(i.team)} · ${esc(i.date)}</span>
            ${i.inj ? `<span class="tag inj">${esc(i.inj)}</span>` : ''}</div>
          <div class="body"><b>${esc(i.headline)}.</b> ${esc(i.body)}</div>
          ${i.tweet ? `<div class="src"><a href="${esc(i.tweet)}" target="_blank"
            rel="noopener">source tweet →</a></div>` : ''}
        </div>`).join('')
        : '<div class="meta-line">No items match — the wire only holds the most recent reports.</div>';
    } catch (e){ fail(box, e); }
  }
  $('w-go').addEventListener('click', loadWire);
  $('w-q').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); loadWire(); }});

  // ── desk (chat) ───────────────────────────────────────────────────────
  const log = $('log'), empty = $('empty'), input = $('input'), send = $('send');
  let sessionId = null, busy = false;

  function inline(s){
    return s
      .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
               '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(text){
    const lines = esc(text).split('\n');
    let html = '', para = [], list = null, code = false, codeBuf = [];
    const flushPara = () => { if (para.length){ html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
    const flushList = () => { if (list){ html += '<' + list.tag + '>' + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + '</' + list.tag + '>'; list = null; } };
    for (let i = 0; i < lines.length; i++){
      const ln = lines[i];
      if (ln.trim().startsWith('```')){
        if (code){ html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>'; codeBuf = []; }
        else { flushPara(); flushList(); }
        code = !code; continue;
      }
      if (code){ codeBuf.push(ln); continue; }
      if (/^\s*\|.*\|\s*$/.test(ln)){
        flushPara(); flushList();
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
          const cells = lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
          if (!cells.every(c => /^:?-{2,}:?$/.test(c))) rows.push(cells);
          i++;
        }
        i--;
        html += '<table>' + rows.map((r, ri) =>
          '<tr>' + r.map(c => (ri ? '<td>' : '<th>') + inline(c) + (ri ? '</td>' : '</th>')).join('') + '</tr>'
        ).join('') + '</table>';
        continue;
      }
      const h = ln.match(/^(#{1,4})\s+(.*)/);
      if (h){ flushPara(); flushList(); html += '<h3>' + inline(h[2]) + '</h3>'; continue; }
      const ul = ln.match(/^\s*[-*·]\s+(.*)/), ol = ln.match(/^\s*\d+[.)]\s+(.*)/);
      if (ul || ol){
        flushPara();
        const tag = ul ? 'ul' : 'ol';
        if (!list || list.tag !== tag){ flushList(); list = {tag, items: []}; }
        list.items.push((ul || ol)[1]); continue;
      }
      if (!ln.trim()){ flushPara(); flushList(); continue; }
      para.push(ln.trim());
    }
    if (code && codeBuf.length) html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>';
    flushPara(); flushList();
    return html;
  }

  const scroll = () => document.querySelector('main').scrollTo(0, 1e9);
  function addTurn(kind, label){
    empty.style.display = 'none';
    const t = el('div', 'turn ' + kind);
    t.appendChild(el('div', 'eyebrow', label));
    log.appendChild(t);
    return t;
  }

  async function ask(text){
    if (busy || !text.trim()) return;
    busy = true; send.disabled = true; input.value = ''; autosize();
    const you = addTurn('you', 'You');
    you.appendChild(el('div', 'body')).textContent = text;
    const desk = addTurn('desk', 'Desk');
    const chips = desk.appendChild(el('div', 'chips'));
    const body = desk.appendChild(el('div', 'body'));
    const working = desk.appendChild(el('div', 'working',
      '<span class="ball"></span><span>on the film</span>'));
    scroll();
    let textParts = [];
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST', headers: {'content-type': 'application/json'},
        body: JSON.stringify({session_id: sessionId, message: text, model: $('model').value}),
      });
      if (!resp.ok) throw new Error((await resp.json()).detail || resp.statusText);
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;){
        const {done, value} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0){
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          if (!chunk.startsWith('data: ')) continue;
          const ev = JSON.parse(chunk.slice(6));
          if (ev.type === 'session') sessionId = ev.session_id;
          else if (ev.type === 'tool'){
            chips.appendChild(el('div', 'chip ' + (ev.family || 'websearch'),
              '<span class="dot"></span><span class="fn">' + esc(ev.name) + '</span>'
              + (ev.args ? '<span>' + esc(ev.args) + '</span>' : '')));
          }
          else if (ev.type === 'text'){
            textParts.push(ev.text);
            body.innerHTML = md(textParts.join('\n\n'));
          }
          else if (ev.type === 'result'){
            if (ev.is_error && !textParts.length)
              body.innerHTML = md(ev.result || 'The agent returned an error.');
            desk.appendChild(el('div', 'meta',
              ev.turns + ' turns · ' + ev.duration_s + 's · $' + ev.cost_usd));
          }
          else if (ev.type === 'error'){
            desk.classList.add('error');
            body.textContent = ev.error + ' — session reset; ask again to start fresh.';
            sessionId = null;
          }
          scroll();
        }
      }
    } catch (e){
      desk.classList.add('error');
      body.textContent = String(e);
    } finally {
      working.remove();
      busy = false; send.disabled = false; input.focus();
      scroll();
    }
  }

  $('deskbar').addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(input.value); }
  });
  function autosize(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }
  input.addEventListener('input', autosize);
  $('starters').addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON') ask(e.target.textContent);
  });
  $('reset').addEventListener('click', () => {
    if (sessionId) fetch('/api/reset', {method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({session_id: sessionId, message: '-'})});
    sessionId = null;
    log.innerHTML = '';
    empty.style.display = '';
    input.focus();
  });

  show(location.hash.slice(1) || 'home');
})();
</script>
</body>
</html>
